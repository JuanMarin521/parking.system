<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechSoft · Parking Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">TechSoft</span>
        <span class="brand-sub">Parking Control</span>
      </div>
      <div class="availability-board">
        <span class="board-label">Spots</span>
        <span class="board-value" id="board-value">-- / --</span>
        <span class="board-status" id="board-status">—</span>
      </div>
    </header>

    <main class="layout">
      <section class="gate-panel">
        <div class="gate">
          <div class="gate-post gate-post--left"></div>
          <div class="gate-post gate-post--right"></div>
          <div class="gate-arm" id="gate-arm"></div>
          <div class="gate-light" id="gate-light"></div>
        </div>

        <div class="ticket">
          <p class="ticket-label">Last plate processed</p>
          <p class="ticket-plate" id="ticket-plate">— — —</p>
          <p class="ticket-detail" id="ticket-detail"></p>
        </div>
      </section>

      <section class="control-panel">
        <div class="tabs">
          <button type="button" class="tab active" data-tab="entry">Register Entry</button>
          <button type="button" class="tab" data-tab="exit">Register Exit</button>
        </div>

        <form id="entry-form" class="tab-panel active">
          <label for="entry-plate">License plate</label>
          <input id="entry-plate" name="entry-plate" type="text" placeholder="e.g. ABC123" autocomplete="off" />
          <button type="submit" class="btn btn--primary">Register Entry</button>
        </form>

        <form id="exit-form" class="tab-panel">
          <label for="exit-plate">License plate</label>
          <input id="exit-plate" name="exit-plate" type="text" placeholder="e.g. ABC123" autocomplete="off" />
          <button type="submit" class="btn btn--primary">Register Exit</button>
        </form>

        <div id="message-box" class="message" role="status" aria-live="polite"></div>

        <div class="table-wrap">
          <div class="table-head">
            <h2>Parked vehicles</h2>
            <button type="button" id="refresh-btn" class="btn btn--ghost">Refresh</button>
          </div>
          <table id="parked-table">
            <thead>
              <tr><th>Plate</th><th>Entry time</th></tr>
            </thead>
            <tbody id="parked-tbody"></tbody>
          </table>
          <p id="empty-state" class="empty-state">No vehicles currently parked.</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
